{% extends 'core/base.html' %}

{% block title %}Doctor Login — Swajarnika{% endblock %}

{% block content %}
<div class="sw-auth-wrap">
    <div class="sw-auth-card">
        <h2><i class="fas fa-user-md" style="color: var(--color-primary);"></i> Doctor Login</h2>

        <form method="post" class="sw-stack">
            {% csrf_token %}
            <div class="sw-form-group">
                <label class="sw-label" for="email">Email</label>
                <input class="sw-input" type="email" id="email" name="email" required autofocus>
            </div>
            <div class="sw-form-group">
                <label class="sw-label" for="password">Password</label>
                <input class="sw-input" type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="sw-btn sw-btn-block sw-btn-lg">Log in</button>
        </form>

        <div class="sw-auth-swap">
            New here? <a href="{% url 'doctor_register' %}">Register as a doctor</a>
            <br>Are you a patient? <a href="{% url 'patient_login' %}">Patient login</a>
        </div>
    </div>
</div>
{% endblock %}
