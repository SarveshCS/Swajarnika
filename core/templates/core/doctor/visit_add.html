{% extends 'core/base.html' %}

{% block title %}New Visit — {{ patient.name }}{% endblock %}

{% block content %}
<div class="sw-page-head">
    <div>
        <h1>New visit for {{ patient.name }}</h1>
        <p class="sw-page-subtitle">Record diagnosis, medications, tests, and files in one form.</p>
    </div>
    <a href="{% url 'doctor_patient_detail' patient.id %}" class="sw-btn sw-btn-secondary">
        <i class="fas fa-arrow-left"></i> Back
    </a>
</div>

<form method="post" enctype="multipart/form-data" class="sw-stack">
    {% csrf_token %}

    <div class="sw-card">
        <div class="sw-card-header"><span><i class="fas fa-stethoscope"></i> Visit Details</span></div>
        <div class="sw-card-body sw-stack">
            <div class="sw-form-group">
                <label class="sw-label">Date of visit</label>
                <input class="sw-input" type="date" name="date_of_visit" max="{% now 'Y-m-d' %}" required>
            </div>
            <div class="sw-form-group">
                <label class="sw-label">Diagnosis</label>
                <textarea class="sw-textarea" name="diagnosis" required rows="3"></textarea>
            </div>
            <div class="sw-form-group">
                <label class="sw-label">Treatment plan</label>
                <textarea class="sw-textarea" name="treatment_plan" required rows="3"></textarea>
            </div>
            <div class="sw-form-group">
                <label class="sw-label">Notes <span class="sw-text-soft">(optional)</span></label>
                <textarea class="sw-textarea" name="notes" rows="2"></textarea>
            </div>
        </div>
    </div>

    <div class="sw-card">
        <div class="sw-card-header">
            <span><i class="fas fa-pills"></i> Medications</span>
            <button type="button" class="sw-btn sw-btn-sm sw-btn-secondary" onclick="addMedRow()">
                <i class="fas fa-plus"></i> Add medication
            </button>
        </div>
        <div class="sw-card-body" id="medList">
            <!-- rows injected here -->
        </div>
    </div>

    <div class="sw-card">
        <div class="sw-card-header">
            <span><i class="fas fa-vial"></i> Tests</span>
            <button type="button" class="sw-btn sw-btn-sm sw-btn-secondary" onclick="addTestRow()">
                <i class="fas fa-plus"></i> Add test
            </button>
        </div>
        <div class="sw-card-body" id="testList">
            <!-- rows injected here -->
        </div>
    </div>

    <div class="sw-card">
        <div class="sw-card-header"><span><i class="fas fa-file-upload"></i> Files</span></div>
        <div class="sw-card-body sw-stack">
            <div class="sw-form-group">
                <label class="sw-label">Attach files <span class="sw-text-soft">(optional, multiple)</span></label>
                <input class="sw-input" type="file" name="files[]" multiple>
            </div>
            <div class="sw-form-group">
                <label class="sw-label">File description</label>
                <input class="sw-input" type="text" name="file_description">
            </div>
        </div>
    </div>

    <div class="sw-flex-between">
        <a href="{% url 'doctor_patient_detail' patient.id %}" class="sw-btn sw-btn-secondary">Cancel</a>
        <button type="submit" class="sw-btn sw-btn-lg"><i class="fas fa-save"></i> Save Visit</button>
    </div>
</form>

<template id="medRowTpl">
    <div class="sw-grid sw-grid-2 sw-mb-3">
        <input class="sw-input" type="text" name="medication_name[]" placeholder="Medication name">
        <input class="sw-input" type="text" name="medication_reason[]" placeholder="Reason">
        <input class="sw-input" type="text" name="medication_instructions[]" placeholder="Instructions">
        <input class="sw-input" type="text" name="medication_missed_instructions[]" placeholder="If missed dose">
    </div>
</template>

<template id="testRowTpl">
    <div class="sw-grid sw-grid-3 sw-mb-3">
        <input class="sw-input" type="text" name="test_name[]" placeholder="Test name">
        <input class="sw-input" type="text" name="test_region[]" placeholder="Region / body part">
        <input class="sw-input" type="text" name="test_reason[]" placeholder="Reason">
    </div>
</template>

<script>
    function addMedRow() {
        const tpl = document.getElementById('medRowTpl').content.cloneNode(true);
        document.getElementById('medList').appendChild(tpl);
    }
    function addTestRow() {
        const tpl = document.getElementById('testRowTpl').content.cloneNode(true);
        document.getElementById('testList').appendChild(tpl);
    }
    // start with one row each
    addMedRow(); addTestRow();
</script>
{% endblock %}
